name: EFB CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libmagic1

      - name: Install dependencies and locked Kettly ETM
        run: |
          python -m pip install --upgrade pip
          git clone https://github.com/kettly1260/efb-telegram-master.git /tmp/efb-telegram-master-kettly
          git -C /tmp/efb-telegram-master-kettly checkout 36b3382ed784efeba176dba269df47d4df0ef4e7
          python -m pip install "setuptools<70" "urllib3<2"
          python -m pip install -e /tmp/efb-telegram-master-kettly
          python -m pip install -e .

      - name: Run full EFB test suite
        env:
          EFB_KETTLY_ROOT: /tmp/efb-telegram-master-kettly
        run: python -m unittest discover -s tests -v

      - name: Compile-check package
        run: python -m compileall -q efb_wechat_comwechat_slave

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5

      - name: Build image (no push)
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: ghcr.io/onestao/wechat-hub-efb-linux-wechat-slave:ci
          build-args: |
            OCI_REVISION=${{ github.sha }}
            OCI_VERSION=ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
