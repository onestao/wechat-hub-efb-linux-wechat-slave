name: EFB Publish GHCR RC Image

on:
  workflow_dispatch:
    inputs:
      rc_tag:
        description: 'RC tag (e.g. 0.1.0-rc.1)'
        required: true
        default: '0.1.0-rc.14-efb-functional'
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

concurrency:
  group: efb-functional-ghcr-publish
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: onestao/wechat-hub-efb-linux-wechat-slave

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: '3.12'

      - name: Install qualification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install setuptools==75.8.2 -r requirements.txt
          git clone https://github.com/kettly1260/efb-telegram-master.git upstream/efb-telegram-master-kettly
          git -C upstream/efb-telegram-master-kettly checkout 36b3382ed784efeba176dba269df47d4df0ef4e7
          python -m pip install -e upstream/efb-telegram-master-kettly
          python -m pip install -e .

      - name: Run final source regression
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Compile-check package and qualification harness
        run: |
          python -m compileall -q efb_wechat_comwechat_slave
          python -m compileall -q scripts/qualification

      - uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5

      - name: Login to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@369eb591f429131d6889c46b94e711f089e6ca96
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=${{ inputs.rc_tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,prefix=sha-

      - name: Build and push RC image
        id: build
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OCI_REVISION=${{ github.sha }}
            OCI_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pull immutable image and verify OCI revision
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          docker pull "${IMAGE_REF}"
          OCI_REVISION="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${IMAGE_REF}")"
          test "${OCI_REVISION}" = "${GITHUB_SHA}"
          printf 'FUNCTIONAL_SOURCE_COMMIT_FULL=%s\n' "${GITHUB_SHA}"
          printf 'FUNCTIONAL_IMAGE_DIGEST=%s\n' "${IMAGE_REF}"
          printf 'FUNCTIONAL_OCI_REVISION=%s\n' "${OCI_REVISION}"

      - name: Run exact-digest isolated shutdown gate
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          python scripts/qualification/run_image_shutdown_gate.py \
            --image "${IMAGE_REF}" \
            --runs 5 \
            --timeout 2 \
            --output functional-image-shutdown-gate.json
          cat functional-image-shutdown-gate.json

      - name: Output digest
        run: |
          echo "## EFB RC Image" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**OCI revision:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Exact-digest shutdown gate:** PASS (5/5)" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
