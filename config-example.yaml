core:
  base_url: http://127.0.0.1:8080
  timeout: 10
  poll_timeout: 15
  verify_tls: true

# Empty means all Core accounts. To isolate one EFB instance, list explicit IDs.
account_ids: []

consumer_id: efb-linux-wechat
poll_interval: 1.0
event_limit: 50
startup_healthcheck: true

# "fast": forward each message as soon as it is ready (text may overtake media).
# "ordered": hold later messages of a chat behind pending media, keeping order,
# for at most ordered_max_wait_sec seconds per pending media.
# ordered_scope: "all" holds text too; "media" orders only images/videos/files.
delivery_mode: fast
ordered_scope: all
ordered_max_wait_sec: 20
