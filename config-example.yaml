core:
  base_url: http://127.0.0.1:8080
  timeout: 10
  poll_timeout: 15
  verify_tls: true

# Empty means all Core accounts. To isolate one EFB instance, list explicit IDs.
account_ids: []

consumer_id: efb-linux-wechat
poll_interval: 1.0
event_limit: 50
startup_healthcheck: true

# React on messages you send from Telegram once Core reports the outcome.
# Per kind: true = every outcome, problems = only uncertain/failed
# (cleared again on a late success), false = off. An empty emoji disables
# that outcome.
send_reactions:
  text: false
  image: false
  file: false
  sent: "👌"
  uncertain: "🤔"
  failed: "👎"
